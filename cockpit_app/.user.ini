; Per-directory PHP settings for Cockpit. Read by PHP when it runs as CGI/FastCGI/FPM
; (php-fpm, php-cgi behind aicserver); mod_php ignores this file and gets the same values
; from Apache (Installs/apache/cockpit-php.conf). Both exist because the two PHP set-ups
; read different places.
;
; Why: the distribution defaults are 2M per file / 8M per request, so a voice note longer
; than about a minute, a video for the transcriber, or a larger chat import was dropped
; without a word. Uploads that travel as base64 inside JSON (attachments, Bookshelf,
; Personal archive) are not affected by these; they raise memory_limit in their own code.
upload_max_filesize = 1G
post_max_size = 1G
