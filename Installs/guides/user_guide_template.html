  <style>
    html {
      color: #d8dce0;

    body {

  </style>
  <style>

    pre { background:#23272c; padding:12px 14px; border-radius:5px; overflow:auto; border:1px solid #2a2e33; }

  <script>
  try {
    const t = JSON.parse(localStorage.getItem('cockpit_theme_resolved'));
    if (t) {
      const s = document.createElement('style');
      s.textContent = `
        html { background-color: ${t.bgBase}; color: ${t.textBase}; }
        body { background: ${t.bgBase}; color: ${t.textBase}; }
        h1,h2,h3 { color: ${t.heading}; }
        h4 { color: ${t.heading}; opacity:.85; }
        h1 { border-bottom-color: ${t.borderMid}; }
        h2 { border-bottom-color: ${t.borderDim}; }
        a, a:visited, #TOC a { color: ${t.accent}; }
        code { background: ${t.bgPanel}; color: ${t.accentAmber}; }
        pre { background: ${t.bgPanel}; border-color: ${t.borderDim}; }
        pre code { background: none; color: ${t.textBase}; }
        th, td { border-color: ${t.borderMid}; color: ${t.textBase}; }
        th { background: ${t.bgPanel}; color: ${t.heading}; }
        li { color: ${t.textBase}; }
        strong { color: ${t.textBase}; filter: brightness(1.1); }
        blockquote { border-left-color: ${t.accentAmber}; color: ${t.textDim}; }
        hr { border-top-color: ${t.borderMid}; }
      `;
      document.head.appendChild(s);
    }
  } catch(e) {}
  </script>

<body>
$if(title)$
<header id="title-block-header">
<h1 class="title">$title$</h1>
</header>
$endif$
$if(toc)$
<nav id="TOC" role="doc-toc">
$table-of-contents$
</nav>
$endif$
$body$
<script>
(function() {
  const input = document.getElementById('ug-search-input');
  const countEl = document.getElementById('ug-search-count');
  const prevBtn = document.getElementById('ug-search-prev');
  const nextBtn = document.getElementById('ug-search-next');
  let marks = [];
  let current = -1;

  function clearMarks() {
    document.querySelectorAll('mark.ug-hit').forEach(m => {
      const parent = m.parentNode;
      parent.replaceChild(document.createTextNode(m.textContent), m);
      parent.normalize();
    });
    marks = []; current = -1;
  }

  // Walk all text nodes under <body> (excluding the search box itself) and
  // wrap case-insensitive matches of `term` in <mark class="ug-hit">.
  function highlight(term) {
    clearMarks();
    if (!term) { countEl.textContent = ''; return; }
    const lower = term.toLowerCase();
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (node.parentElement.closest('#ug-search-box, script, style')) return NodeFilter.FILTER_REJECT;
        return node.nodeValue.toLowerCase().includes(lower) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
      }
    });
    const targets = [];
    let n; while ((n = walker.nextNode())) targets.push(n);
    targets.forEach(node => {
      const text = node.nodeValue;
      const lowerText = text.toLowerCase();
      const frag = document.createDocumentFragment();
      let i = 0, idx;
      while ((idx = lowerText.indexOf(lower, i)) !== -1) {
        frag.appendChild(document.createTextNode(text.slice(i, idx)));
        const mark = document.createElement('mark');
        mark.className = 'ug-hit';
        mark.style.cssText = 'background:#e6b43c;color:#1a1d21;border-radius:2px;';
        mark.textContent = text.slice(idx, idx + term.length);
        frag.appendChild(mark);
        marks.push(mark);
        i = idx + term.length;
      }
      frag.appendChild(document.createTextNode(text.slice(i)));
      node.parentNode.replaceChild(frag, node);
    });
    current = marks.length ? 0 : -1;
    updateCount();
    if (current >= 0) goTo(current);
  }
  function updateCount() {
    countEl.textContent = marks.length ? (current + 1) + '/' + marks.length : (input.value ? '0/0' : '');
  }
  function goTo(i) {
    marks.forEach(m => m.style.outline = '');
    if (!marks.length) return;
    current = ((i % marks.length) + marks.length) % marks.length;
    const m = marks[current];
    m.style.outline = '2px solid #e6b43c';
    m.scrollIntoView({ block: 'center', behavior: 'smooth' });
    updateCount();
  }
  input.addEventListener('input', () => highlight(input.value.trim()));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); goTo(current + (e.shiftKey ? -1 : 1)); }
    if (e.key === 'Escape') { input.value = ''; clearMarks(); countEl.textContent = ''; input.blur(); }
  });
  nextBtn.addEventListener('click', () => goTo(current + 1));
  prevBtn.addEventListener('click', () => goTo(current - 1));
  // Global "/" focuses search (like GitHub), unless already typing somewhere.
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); }
  });
})();
</script>

</body>
