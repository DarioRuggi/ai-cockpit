# =============================================================================
# cockpit-cache.conf — make a deployed change visible on the next reload.
#
# Apache served index.html with no Cache-Control at all, so browsers applied
# their own heuristic and kept the previous copy: after a deploy the app looked
# unchanged until someone thought to press Ctrl+Shift+R. That turned every
# release into "did it deploy, or am I looking at yesterday?" — and a stale
# index.html against fresh js/ is worse than either alone.
#
# no-cache does NOT mean "do not cache": the browser keeps the file and
# revalidates it, so an unchanged file costs one 304 and no download. The ?v=
# stamps on css/js still do the heavy lifting; this is what makes the HTML that
# references them honest.
# =============================================================================
<IfModule mod_headers.c>
    <Directory "/var/www/html">
        <FilesMatch "\.(html|js|css|json)$">
            Header set Cache-Control "no-cache, must-revalidate"
        </FilesMatch>
    </Directory>
</IfModule>
