# =============================================================================
# cockpit-php.conf — upload size limits for Cockpit under Apache's mod_php.
#
# PHP ships with upload_max_filesize=2M and post_max_size=8M. Cockpit's multipart
# uploads (voice notes for dictation, videos for the transcriber, chat imports)
# were therefore dropped without a word as soon as they passed 2 MB: PHP just
# hands the script an empty $_FILES. These two settings can only be set per
# directory (not with ini_set), so mod_php gets them here; PHP running as
# FastCGI/FPM/php-cgi reads the same values from cockpit_app/.user.ini.
#
# Uploads that travel as base64 inside JSON (attachments, Bookshelf, Personal
# archive) are limited by memory_limit instead and raise it in their own code.
# =============================================================================
<DirectoryMatch "/cockpit(-v1)?(/|$)">
    <IfModule mod_php.c>
        php_value upload_max_filesize 1G
        php_value post_max_size 1G
    </IfModule>
    <IfModule mod_php8.c>
        php_value upload_max_filesize 1G
        php_value post_max_size 1G
    </IfModule>
</DirectoryMatch>
