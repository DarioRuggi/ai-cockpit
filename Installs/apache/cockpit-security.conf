# =============================================================================
# cockpit-security.conf — keep Cockpit's working folders and data files off the web.
#
# Found by the 2026-10-05 standalone audit: Apache listens on every network
# interface, and for Cockpit it (a) listed the contents of queue/ and responses/
# and served the files in them to anyone on the LAN with no login (agent replies
# hold prompts, code and personal text), and (b) served a few data files that
# only PHP ever reads (paths.json, usage log, project state, quotas).
# Nothing in Cockpit fetches any of them over HTTP — PHP reads them from disk —
# so closing them changes nothing for the app.
#
#   1. no folder listings anywhere under a Cockpit root;
#   2. queue/ and responses/ are never served at all;
#   3. internal data files are never served.
# Matches "/cockpit" and "/cockpit-v1" under any document root (Debian, Fedora,
# Arch and SUSE put it in different places).
# =============================================================================
<DirectoryMatch "/cockpit(-v1)?(/|$)">
    Options -Indexes
    <FilesMatch "^(paths|project_state|workers_quotas)\.json$|^\.user\.ini$|\.jsonl$|\.(lock|sock)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>
<DirectoryMatch "/cockpit(-v1)?/(queue|responses)(/|$)">
    Require all denied
</DirectoryMatch>
