<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cockpit Icon Font</title>
<style>
@font-face { font-family:'MS'; src:url(data:font/woff2;base64,@@B64@@) format('woff2'); font-display:block; }
:root { --bg:#faf9f7; --fg:#1b1a18; --dim:#6b6864; --line:#e2ded8; --card:#fff; --accent:#2f6f9f; --warn:#8a6d1f; }
@media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) {
  --bg:#141414; --fg:#eceae7; --dim:#9a958e; --line:#2c2b29; --card:#1c1c1b; --accent:#7fc0ef; --warn:#d9b44a; } }
:root[data-theme="dark"] { --bg:#141414; --fg:#eceae7; --dim:#9a958e; --line:#2c2b29; --card:#1c1c1b; --accent:#7fc0ef; --warn:#d9b44a; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 16px 40px}
header{position:sticky;top:0;background:var(--bg);padding:18px 0 10px;border-bottom:1px solid var(--line);z-index:5}
h1{margin:0 0 2px;font-size:19px;letter-spacing:-.01em}
p.sub{margin:0 0 12px;color:var(--dim);font-size:12.5px}
input{width:100%;max-width:420px;padding:8px 11px;font-size:14px;border:1px solid var(--line);
 border-radius:7px;background:var(--card);color:var(--fg)}
#count{color:var(--dim);font-size:12px;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:7px;margin-top:16px}
.g{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 5px 8px;cursor:pointer;
 background:var(--card);border:1px solid var(--line);border-radius:8px;color:inherit;font:inherit;
 text-align:center;overflow:hidden}
.g:hover{border-color:var(--accent)}
.g.x{border-style:dashed}
.ms{font-family:'MS';font-size:26px;line-height:1;font-weight:normal;font-style:normal;
 letter-spacing:normal;text-transform:none;white-space:nowrap;word-wrap:normal;direction:ltr;
 -webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
.nm{font-size:9.5px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
 width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{font-size:12px;color:var(--dim);margin-top:10px}
.legend b{color:var(--warn);font-weight:600}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:var(--bg);
 padding:7px 14px;border-radius:6px;font-size:12.5px;opacity:0;transition:opacity .18s;pointer-events:none}
#toast.on{opacity:1}
</style></head><body>
<header>
<h1>Cockpit icon font</h1>
<p class="sub">Material Symbols Rounded &mdash; the complete catalogue, vendored in <code>cockpit_app/assets/fonts/</code> and served from this machine. Click any icon to copy its name.</p>
<input id="q" placeholder="Filter by name…" autocomplete="off"><span id="count"></span>
<div class="legend">All <b>@@USED@@</b> icons the font can render. Use any of them by name &mdash; nothing to rebuild.</div>
</div>
</header>
<div class="grid" id="grid">
@@CELLS@@
</div>
<div id="toast"></div>
<script>
const grid=document.getElementById('grid'), q=document.getElementById('q'),
      count=document.getElementById('count'), toast=document.getElementById('toast');
const all=[...grid.children];
function refresh(){
  const t=q.value.trim().toLowerCase(); let n=0;
  for(const el of all){ const hit=!t||el.dataset.n.includes(t); el.style.display=hit?'':'none'; if(hit)n++; }
  count.textContent=n+' of '+all.length;
}
q.addEventListener('input',refresh); refresh();
let tid;
grid.addEventListener('click',e=>{
  const b=e.target.closest('.g'); if(!b)return;
  navigator.clipboard.writeText(b.dataset.n).then(()=>{
    toast.textContent='copied  '+b.dataset.n; toast.classList.add('on');
    clearTimeout(tid); tid=setTimeout(()=>toast.classList.remove('on'),1100);
  }).catch(()=>{});
});
</script></body></html>
